services:
  surroundcore:
    build: ./core
    container_name: surroundcore
    restart: unless-stopped
    network_mode: host
    group_add:
      - "${SURROUNDCORE_MEDIA_GID:-1000}"
    environment:
      SURROUNDCORE_MEDIA: /media
      SURROUNDCORE_DATA: /data
      SURROUNDCORE_SOURCE_CACHE: /cache
      SURROUNDCORE_CACHE_MAX_GB: ${SURROUNDCORE_CACHE_MAX_GB:-0}
      SURROUNDCORE_CACHE_MIN_FREE_GB: ${SURROUNDCORE_CACHE_MIN_FREE_GB:-5}
      SURROUNDCORE_PUBLIC_URL: ${SURROUNDCORE_PUBLIC_URL}
      SURROUNDCORE_TOKEN: ${SURROUNDCORE_TOKEN}
      SURROUNDCORE_AIRIA_DECODER: ${SURROUNDCORE_AIRIA_DECODER:-}
      SURROUNDCORE_SPOTIFY_SOLOIST: ${SURROUNDCORE_SPOTIFY_SOLOIST:-/opt/spotify/soloist}
    volumes:
      - ${SURROUNDCORE_MEDIA:-/srv/surroundcore/media}:/media:ro
      - ${SURROUNDCORE_DATA:-/var/lib/surroundcore}:/data
      - ${SURROUNDCORE_SOURCES:-/srv/surroundcore/sources}:/sources:ro,rslave
      - ${SURROUNDCORE_CACHE:-/var/cache/surroundcore}:/cache
      - ${SURROUNDCORE_SPOTIFY_DIR:-/opt/surroundcore/spotify}:/opt/spotify:ro

  surround-ingest:
    build: ./ingest
    container_name: surround-ingest
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      SURROUNDCORE_TOKEN: ${SURROUNDCORE_TOKEN}
      SURROUNDCORE_CORE_URL: http://127.0.0.1:8080
      SURROUNDCORE_INGEST_ROOT: /ingest
      SURROUNDCORE_INGEST_LIBRARY: /library
      SURROUNDCORE_AUTO_RIP: ${SURROUNDCORE_AUTO_RIP:-true}
      SURROUNDCORE_AUTO_NETMD: ${SURROUNDCORE_AUTO_NETMD:-true}
      SURROUNDCORE_INGEST_EJECT: ${SURROUNDCORE_INGEST_EJECT:-true}
      SURROUNDCORE_INGEST_KEEP_UPLOADS: ${SURROUNDCORE_INGEST_KEEP_UPLOADS:-false}
      SURROUNDCORE_INGEST_POLL_SECONDS: ${SURROUNDCORE_INGEST_POLL_SECONDS:-8}
      SURROUNDCORE_INGEST_MAX_UPLOAD_GB: ${SURROUNDCORE_INGEST_MAX_UPLOAD_GB:-0}
      SURROUNDCORE_MAKEMKVCON: ${SURROUNDCORE_MAKEMKVCON:-/opt/makemkv/makemkvcon}
    volumes:
      - ${SURROUNDCORE_INGEST_DATA:-/var/lib/surroundcore/ingest}:/ingest
      - ${SURROUNDCORE_INGEST_LIBRARY:-/srv/surroundcore/sources/ingest}:/library
      - ${SURROUNDCORE_MAKEMKV_DIR:-/opt/surroundcore/makemkv}:/opt/makemkv:ro
      - /run/udev:/run/udev:ro
